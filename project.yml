name: EdenDriveIQ
options:
  xcodeVersion: "27.0"
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
targets:
  EdenDriveIQ:
    type: application
    platform: iOS
    sources:
      - path: EdenDriveIQ
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.edendrive.iq
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: EdenDriveIQ/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
